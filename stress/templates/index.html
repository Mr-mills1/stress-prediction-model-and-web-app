<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>Stress Text Classifier</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #17243b;
            background: #f5f7fb;
            font-synthesis: none;
            text-rendering: optimizeLegibility;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 32px 18px;
            background:
                radial-gradient(circle at 12% 12%, rgba(120, 157, 255, .16), transparent 30rem),
                radial-gradient(circle at 88% 90%, rgba(75, 196, 171, .13), transparent 28rem),
                #f5f7fb;
        }

        main {
            width: min(100%, 720px);
        }

        .eyebrow {
            margin: 0 0 12px;
            color: #546b99;
            font-size: .75rem;
            font-weight: 750;
            letter-spacing: .14em;
            text-align: center;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            color: #182844;
            font-size: clamp(2rem, 6vw, 3.15rem);
            letter-spacing: -.055em;
            line-height: 1.08;
            text-align: center;
        }

        .intro {
            max-width: 520px;
            margin: 16px auto 30px;
            color: #64728a;
            font-size: 1rem;
            line-height: 1.65;
            text-align: center;
        }

        .panel {
            padding: clamp(22px, 5vw, 36px);
            border: 1px solid rgba(218, 225, 238, .9);
            border-radius: 22px;
            background: rgba(255, 255, 255, .92);
            box-shadow: 0 24px 70px rgba(37, 57, 91, .1);
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #263752;
            font-size: .9rem;
            font-weight: 700;
        }

        textarea {
            display: block;
            width: 100%;
            min-height: 180px;
            resize: vertical;
            padding: 16px;
            border: 1px solid #dce3ef;
            border-radius: 13px;
            outline: none;
            background: #fbfcfe;
            color: #17243b;
            font: inherit;
            line-height: 1.6;
            transition: border-color .2s, box-shadow .2s;
        }

        textarea::placeholder {
            color: #9aa6b8;
        }

        textarea:focus {
            border-color: #6988e8;
            box-shadow: 0 0 0 4px rgba(105, 136, 232, .14);
        }

        .form-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-top: 16px;
        }

        .hint {
            margin: 0;
            color: #7a879b;
            font-size: .82rem;
        }

        button {
            min-height: 48px;
            padding: 0 22px;
            border: 0;
            border-radius: 11px;
            background: #4268d5;
            color: white;
            cursor: pointer;
            font: inherit;
            font-size: .92rem;
            font-weight: 700;
            transition: background .2s, transform .2s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-1px);
            background: #3459c2;
        }

        button:focus-visible {
            outline: 3px solid rgba(66, 104, 213, .3);
            outline-offset: 3px;
        }

        button:disabled {
            cursor: wait;
            opacity: .7;
        }

        .result {
            margin-top: 22px;
            padding: 17px 18px;
            border: 1px solid #dce6fa;
            border-radius: 13px;
            background: #f4f7ff;
        }

        .result[hidden] {
            display: none;
        }

        .result-label {
            display: block;
            margin-bottom: 5px;
            color: #687895;
            font-size: .76rem;
            font-weight: 750;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        #result-message {
            margin: 0;
            color: #20365f;
            font-size: 1rem;
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        .result.error {
            border-color: #f2d4d1;
            background: #fff7f6;
        }

        .result.error #result-message {
            color: #9b3933;
        }

        .disclaimer {
            margin: 18px 8px 0;
            color: #8490a2;
            font-size: .78rem;
            line-height: 1.55;
            text-align: center;
        }

        @media (max-width: 520px) {
            .form-footer {
                align-items: stretch;
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">Model testing interface</p>
        <h1>Explore a text prediction</h1>
        <p class="intro">Enter a sentence or a short passage and let the trained model classify it.</p>

        <section class="panel" aria-label="Text prediction form">
            <form id="prediction-form" action="/predict" method="post">
                <label for="text">Text to analyze</label>
                <textarea id="text" name="text" placeholder="Type or paste text here..." required></textarea>
                <div class="form-footer">
                    <p class="hint">Your text is sent to the local model for prediction.</p>
                    <button id="submit-button" type="submit">Analyze text</button>
                </div>
            </form>

            <section id="result" class="result" aria-live="polite" hidden>
                <span class="result-label">Model prediction</span>
                <p id="result-message"></p>
            </section>
        </section>

        <p class="disclaimer">This is an experimental model output, not a clinical assessment or diagnosis.</p>
    </main>

    <script>
        const form = document.querySelector("#prediction-form");
        const submitButton = document.querySelector("#submit-button");
        const result = document.querySelector("#result");
        const resultMessage = document.querySelector("#result-message");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            result.hidden = true;
            result.classList.remove("error");
            submitButton.disabled = true;
            submitButton.textContent = "Analyzing...";

            try {
                const response = await fetch(form.action, {
                    method: "POST",
                    body: new FormData(form)
                });
                const payload = await response.json();

                if (!response.ok) {
                    throw new Error(payload.error || "The prediction request failed.");
                }

                resultMessage.textContent = payload.prediction;
                result.hidden = false;
            } catch (error) {
                resultMessage.textContent = error.message || "Unable to reach the prediction service.";
                result.classList.add("error");
                result.hidden = false;
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = "Analyze text";
            }
        });
    </script>
</body>
</html>
